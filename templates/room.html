<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Room {{.Code}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <div class="container mx-auto p-8">
      <h1 class="text-3xl font-bold mb-6 text-center">Room {{.Code}}</h1>

      <div
        id="chat"
        class="max-w-lg mx-auto bg-white border rounded p-4 h-64 overflow-y-scroll mb-4"
      ></div>

      <form id="msgForm" class="max-w-lg mx-auto flex space-x-2">
        <input
          type="text"
          id="msgInput"
          placeholder="Type a message…"
          class="flex-1 border rounded px-3 py-2"
          autofocus
        />
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        >
          Send
        </button>
      </form>
    </div>

    <script>
      const ws = new WebSocket("ws://" + location.host + "/ws/{{.Code}}");
      const chat = document.getElementById("chat");
      const form = document.getElementById("msgForm");
      const input = document.getElementById("msgInput");

      ws.onmessage = (e) => {
        const msg = document.createElement("div");
        msg.textContent = e.data;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      };

      form.onsubmit = (e) => {
        e.preventDefault();
        if (input.value.trim() !== "") {
          ws.send(input.value);
          input.value = "";
        }
      };
    </script>
  </body>
</html>
